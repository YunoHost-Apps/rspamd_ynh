version = "1.0"

[main]
name.en = "Rspamd configuration"
services = ["__APP__"]

    [main.customization]

        [main.customization.per_user]
        type = "boolean"
        ask.en = "Enable per user classifier."
        ask.fr = "Activer la classification par utilisateur."
        default = 0

        [main.customization.min_learns]
        type = "number"
        ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
        ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la classification."
        default = 200
        min = 1
        max = 9999

        [main.customization.dkim_whitelist_domains]
        type = "tags"
        ask.en = "Own domains whose mails with a valid DKIM signature are never classified as spam (e.g. web form mails)."
        ask.fr = "Domaines propres dont les mails avec une signature DKIM valide ne sont jamais classés comme spam (ex. mails de formulaires web)."
        optional = true
