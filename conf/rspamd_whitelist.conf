# Managed by the YunoHost rspamd app: set the domains in the app's config panel
# ("Own domains whose mails with a valid DKIM signature are never classified as
# spam") instead of editing this file.
#
# Lets mail of the own domains through (e.g. web form mails) if it carries a
# valid DKIM signature of one of these domains.
# Cannot be forged: the whitelist module checks the SIGNING domain, not just
# the presence of any valid signature. A stranger setting From: to one of these
# domains and signing with their own domain does not match.
#
# Score -50.0 so that even a mail with many positive symbols (e.g. a form mail
# full of links and spammy words) is not rejected while it is signed.
rules {
  "WL_OWN_DOMAIN_DKIM" {
    valid_dkim = true;
    domains = [__DKIM_WHITELIST_DOMAINS_LIST__];
    score = -50.0;
  }
}
