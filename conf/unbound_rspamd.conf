# /etc/unbound/unbound.conf.d/rspamd.conf
# Local recursive resolver used by rspamd only (see /etc/rspamd/local.d/options.inc).
# DNS list operators (Spamhaus, URIBL, DNSWL) block queries coming through shared
# public resolvers like the ones YunoHost's dnsmasq forwards to.
# Port 5353 so it doesn't collide with dnsmasq on port 53.
server:
    interface: 127.0.0.1@5353
    access-control: 127.0.0.0/8 allow
    prefetch: yes
