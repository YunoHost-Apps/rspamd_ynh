#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.2.2~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.per_user]
    ask.en = "Enable per user classifier."
    ask.fr = "Activer la classification par utilisateur."
    type = "boolean"
    default = false

    [install.min_learns]
    ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
    ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la calssification."
    type = "number"
    default = 200
    min = 1
    max = 9999

[resources]
    [resources.sources.main]
    # Just used for autoupdate alert
    url = "https://github.com/rspamd/rspamd/archive/refs/tags/4.2.2.tar.gz"
    sha256 = "dcad37d30c4e7cfc5576442bcd5c741d4895b1ef22b35a41daf150e74047f4d6"

    autoupdate.strategy = "latest_github_release"

    [resources.sources.deb_trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.2-1~a5bf035~trixie_amd64.deb"
    amd64.sha256 = "27adbb5b36bc89c8632a3d5142c96d1db300160b111f9273e6314e878b347cc6"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.2-1~a5bf035~trixie_arm64.deb"
    arm64.sha256 = "b37ba6868fb86376d19da9dd3662fdc4a0cbdd5c9bcd46864db9e0567530aa0e"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.deb_bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.2-1~a5bf035~bookworm_amd64.deb"
    amd64.sha256 = "6758af6ad78cb4bc11182bc66e1d91c3b706a03b4b6ab25ecca11f2f7e9927fd"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.2-1~a5bf035~bookworm_arm64.deb"
    arm64.sha256 = "015fe686fb464defba71d9842b57bb3ff37a9dd369c4361e8faa11dd6a72741c"
    extract = false
    rename = "rspamd.deb"

    # [resources.ports]
    # main.default = 11332
    # main.fixed = true

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libssl3t64, libarchive13t64, libicu76, libbinutils"
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libssl3, libarchive13, libicu72, libbinutils"
    fi
    """
