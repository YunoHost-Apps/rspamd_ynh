#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.2.3~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.per_user]
    ask.en = "Enable per user classifier."
    ask.fr = "Activer la classification par utilisateur."
    type = "boolean"
    default = false

    [install.min_learns]
    ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
    ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la calssification."
    type = "number"
    default = 200
    min = 1
    max = 9999

[resources]
    [resources.sources.main]
    # Just used for autoupdate alert
    url = "https://github.com/rspamd/rspamd/archive/refs/tags/4.2.3.tar.gz"
    sha256 = "9e75cad61e39ba93ebbfb85674ff9862aa5b1873f1bd80e96edc6c823b011702"

    autoupdate.strategy = "latest_github_release"

    [resources.sources.deb_trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.3-1~50bde75~trixie_amd64.deb"
    amd64.sha256 = "1ac8960ef414aa39662a44ca7cecc2daf5f7642f7af377cc188171870a001803"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.3-1~50bde75~trixie_arm64.deb"
    arm64.sha256 = "97494e207fdcbf4bbe5cef9aab3d67a097220cd768060db3d8f9a954c4020d82"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.deb_bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.3-1~50bde75~bookworm_amd64.deb"
    amd64.sha256 = "ac46ae8e6f26b72308605f8eaa526590185b29e336920b7defa464d09fe229a0"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.3-1~50bde75~bookworm_arm64.deb"
    arm64.sha256 = "70d563a730fbf133d26e62f428b0d845088470f5d366adc49f92f94955b93c3f"
    extract = false
    rename = "rspamd.deb"

    # [resources.ports]
    # main.default = 11332
    # main.fixed = true

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libssl3t64, libarchive13t64, libicu76, libbinutils"
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libssl3, libarchive13, libicu72, libbinutils"
    fi
    """
