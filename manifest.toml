#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.1.5~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.17'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

[resources]

    [resources.sources.trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.5-1~9a291a4~trixie_amd64.deb"
    amd64.sha256 = "0b2d7a53db33a76e5cbc53ad1ba99574ddeb6d1164bc628af9f4a5e2dd98b34e"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.5-1~9a291a4~trixie_arm64.deb"
    arm64.sha256 = "ee0be0c9c97de320f23f56f865e3ed33ba6f30ddcc0ff20de5e16c366abb4de6"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.5-1~9a291a4~bookworm_amd64.deb"
    amd64.sha256 = "937c3cac5bb0f1e0b09adc69820d0ba3f988dea36db669d246f92006493df7e3"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.5-1~9a291a4~bookworm_arm64.deb"
    arm64.sha256 = "22c5570be0aa53c36a5f844e2b56cd549251dcce27f3f87b12ea582b8f3a2de5"
    extract = false
    rename = "rspamd.deb"
    
    [resources.permissions]

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0, libssl3, libarchive13, libbinutils"
