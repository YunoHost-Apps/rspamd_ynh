#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.2.1~ynh3"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.per_user]
    ask.en = "Enable per user classifier."
    ask.fr = "Activer la classification par utilisateur."
    type = "boolean"
    default = false

    [install.min_learns]
    ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
    ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la calssification."
    type = "number"
    default = 200
    min = 1
    max = 9999

[resources]
    [resources.sources.main]
    # Just used for autoupdate alert
    url = "https://github.com/rspamd/rspamd/archive/refs/tags/4.2.1.tar.gz"
    sha256 = "ea3f90ea4b68728fc4a5e2a36acd8a6d6e8b1b583a3353b95ae7a5f6fb4cd0e1"

    autoupdate.strategy = "latest_github_release"

    [resources.sources.deb_trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.1-1~b7a16ae~trixie_amd64.deb"
    amd64.sha256 = "4268147ec9cb5685cfe0d95de8452c66d6548ad64a1d1d8e489225b4752d3fb1"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.1-1~b7a16ae~trixie_arm64.deb"
    arm64.sha256 = "f691187cd6fb383751b75e81dec06ff0709f2227609fe144204543328724e3b0"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.deb_bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.1-1~b7a16ae~bookworm_amd64.deb"
    amd64.sha256 = "c684c1fc791c85ef19c4284a51095d59cd511a52f15a9e8dfe76dac162b04027"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.2.1-1~b7a16ae~bookworm_arm64.deb"
    arm64.sha256 = "ac32e696fa47bd9f8e9b53308636a1968573b6722de96593516a4d21936d6adb"
    extract = false
    rename = "rspamd.deb"

    # [resources.ports]
    # main.default = 11332
    # main.fixed = true

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libssl3t64, libarchive13t64, libicu76, libbinutils"
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libssl3, libarchive13, libicu72, libbinutils"
    fi
    """
