#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.1.4~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.17'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

[resources]

    [resources.sources.trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.4-1~beb659b~trixie_amd64.deb"
    amd64.sha256 = "5740291809bdd4d00818d08f3512ecd8da7fbe6f5b33de7bed616c46619f5203"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.4-1~beb659b~trixie_arm64.deb"
    arm64.sha256 = "1cb2194eac47d009250fa7a0771fb677d45a044c9fa8bdde61b4c5afcdc7e1f9"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.4-1~beb659b~bookworm_amd64.deb"
    amd64.sha256 = "2ee2420daa875235e61a116e27882f85f13bcdab4cb920effbd81de662587d27"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.1.4-1~beb659b~bookworm_arm64.deb"
    arm64.sha256 = "a5070ec50a3b6ffc6fedee438d046d9b18d3676e84b019df7ba9e9575875efe1"
    extract = false
    rename = "rspamd.deb"
    
    [resources.permissions]

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0, libssl3, libarchive13, libbinutils"
