#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.3.1~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.per_user]
    ask.en = "Enable per user classifier."
    ask.fr = "Activer la classification par utilisateur."
    type = "boolean"
    default = false

    [install.min_learns]
    ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
    ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la calssification."
    type = "number"
    default = 200
    min = 1
    max = 9999

[resources]
    [resources.sources.main]
    # Just used for autoupdate alert
    url = "https://github.com/rspamd/rspamd/archive/refs/tags/4.3.1.tar.gz"
    sha256 = "b58ad4a3d8136d7b05f66193f82007f0a1a04941e21cec1cb4c5b4aca868bdd8"

    autoupdate.strategy = "latest_github_release"

    [resources.sources.deb_trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.1-1~73b8fe1~trixie_amd64.deb"
    amd64.sha256 = "0468bd1bce57ddedfe41825ed0f4e643592090493176a0b830967612f4549a2f"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.1-1~73b8fe1~trixie_arm64.deb"
    arm64.sha256 = "61300c15d1091d3fa6fed0e4af0b14a34c7aab3cfd15f86cdf538648c988be73"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.deb_bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.1-1~73b8fe1~bookworm_amd64.deb"
    amd64.sha256 = "7e1dd2bb3bba196fc805942712df2c4d5563340af65da3048fdfa9751e9f9fcb"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.1-1~73b8fe1~bookworm_arm64.deb"
    arm64.sha256 = "90b59933e84f0206043fb6d28dd1b81f4e4eea14ef2f6ceb0387a5b50f98dbdb"
    extract = false
    rename = "rspamd.deb"

    # [resources.ports]
    # main.default = 11332
    # main.fixed = true

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libssl3t64, libarchive13t64, libicu76, libbinutils"
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libssl3, libarchive13, libicu72, libbinutils"
    fi
    """
