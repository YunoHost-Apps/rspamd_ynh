#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "rspamd"
name = "Rspamd"

description.en = "Spam filtering system"
description.fr = "Système pour filtrer les spams"

version = "4.3.0~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://rspamd.com/"
admindoc = "https://rspamd.com/doc"
code = "https://github.com/rspamd/rspamd"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.per_user]
    ask.en = "Enable per user classifier."
    ask.fr = "Activer la classification par utilisateur."
    type = "boolean"
    default = false

    [install.min_learns]
    ask.en = "Minimum learn to count for both spam and ham classes to perform classification."
    ask.fr = "Quantité minimale de messages spam et/ou ham pour définir la calssification."
    type = "number"
    default = 200
    min = 1
    max = 9999

[resources]
    [resources.sources.main]
    # Just used for autoupdate alert
    url = "https://github.com/rspamd/rspamd/archive/refs/tags/4.3.0.tar.gz"
    sha256 = "29e0e64c0e2a9eeba41f47a149cd3739e0671a8bf67ec37cb46b4933d40068a4"

    autoupdate.strategy = "latest_github_release"

    [resources.sources.deb_trixie]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.0-1~25c9ecc~trixie_amd64.deb"
    amd64.sha256 = "f188cc4a2500ac3b14f5ee0da21143556daf4a23c323d17893291e47009453ac"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.0-1~25c9ecc~trixie_arm64.deb"
    arm64.sha256 = "834b597d49ce0bd78dae7bb4502b494ca48323d416f1f3b1f6c623aee9c21843"
    extract = false
    rename = "rspamd.deb"

    [resources.sources.deb_bookworm]
    amd64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.0-1~25c9ecc~bookworm_amd64.deb"
    amd64.sha256 = "e752493fe069d7876284136bc3b20b999d256153f5149cdfa18137e062222e2c"
    arm64.url = "https://rspamd.com/apt-stable/pool/main/r/rspamd/rspamd_4.3.0-1~25c9ecc~bookworm_arm64.deb"
    arm64.sha256 = "32316fd212ccdcc93639e6d75a0f2a9452ed1c12dda5abe891e2c91045a1cc64"
    extract = false
    rename = "rspamd.deb"

    # [resources.ports]
    # main.default = 11332
    # main.fixed = true

    [resources.apt]
    packages = "redis-server, libhyperscan5, postfix, libsodium23, libsqlite3-0"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libssl3t64, libarchive13t64, libicu76, libbinutils"
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libssl3, libarchive13, libicu72, libbinutils"
    fi
    """
